services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: varuna
      POSTGRES_PASSWORD: varuna
      POSTGRES_DB: varuna_netra
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varuna -d varuna_netra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  #minio:
    #image: minio/minio:latest
    #command: server /data --console-address ":9001"
    #environment:
      #MINIO_ROOT_USER: varuna_minio
      #MINIO_ROOT_PASSWORD: varuna_minio_secret
    #ports: ["9000:9000", "9001:9001"]
    #volumes: ["miniodata:/data"]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/app/app   # live reload of source during development
      - scene_data:/tmp/varuna-netra

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend/app:/app/app
      - scene_data:/tmp/varuna-netra

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports: ["5174:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  scene_data:
  #miniodata:
