name: Deploy Varuna Netra Backend to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf upload \
            balapraharsham/varuna-netra-api \
            . \
            . \
            --repo-type=space \
            --exclude="backend/app/detection/ennore-search.json" \
            --exclude="scenes.json" \
            --exclude=".github/*" \
            --exclude=".git/*" \
            --delete="*" \
            --commit-message="Deploy from GitHub"
